# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

.core-defs:
  variables:
    JNI_PATH: .
    CORENAME: supermodel
    MAKEFILE: Makefile

include:
  ################################## DESKTOPS ################################
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'

  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'

  # Linux ARM64 (native aarch64 runner; auto-detects linux-aarch64: GLES3 + JIT for RPi4/5)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'

  # macOS 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-x64.yml'

  # macOS ARM 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-arm64.yml'

  ################################## CELLULAR ################################
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-jni.yml'

  # iOS and tvOS (arm64). Both run on the Apple Silicon runner and are the GLES
  # build with Apple's SDK in front of it - see the jobs at the end.
  - project: 'libretro-infrastructure/ci-templates'
    file: '/ios-arm64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/tvos-arm64.yml'

  #################################### MISC ##################################
  # webOS 32-bit (LGTV)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/webos-make.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

################################### DESKTOPS #################################
# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs

# Linux ARM64
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs

# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs
  script:
    - make -C ${MAKEFILE_PATH} -f ${MAKEFILE} -j${NUMPROC}
    # Fail the job instead of uploading nothing: when the Makefile did not
    # match platform=win64, make had nothing to do, exited 0 and the job went
    # green while no DLL was ever produced.
    - test -f ${MAKEFILE_PATH}/${CORENAME}_libretro.dll

# macOS 64-bit
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs

# macOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs

################################### CELLULAR #################################
# Android ARMv7a
android-armeabi-v7a:
  extends:
    - .libretro-android-jni-armeabi-v7a
    - .core-defs

# Android ARMv8a (ARM64 + JIT dynarec)
android-arm64-v8a:
  extends:
    - .libretro-android-jni-arm64-v8a
    - .core-defs

# Android x86_64
android-x86_64:
  extends:
    - .libretro-android-jni-x86_64
    - .core-defs

# iOS (arm64)
#
# The GLES build with Apple's SDK in front of it: every GL entry point comes
# through glsym, so nothing links against a framework, and Legacy3D is dropped
# the way it is on the other GLES platforms.
#
# No PPC JIT - writing and then executing a page needs an entitlement a core
# cannot ask for on stock iOS, so Model 3 runs on the interpreter here. That is
# worth having anyway: the alternative is not building for the platform at all.
#
# allow_failure while these are new. Neither SDK exists outside the Apple
# runner, so the first pipeline is the first time this toolchain sees the tree.
libretro-build-ios-arm64:
  allow_failure: true
  extends:
    - .libretro-ios-arm64-make-default
    - .core-defs

# tvOS (arm64). Same core and the same bargain on the JIT; the Apple TV is the
# one device in this family with a screen, a controller and no battery.
libretro-build-tvos-arm64:
  allow_failure: true
  extends:
    - .libretro-tvos-arm64-make-default
    - .core-defs

#################################### MISC ##################################
# webOS 32-bit
libretro-build-webos-armv7a:
  extends:
    - .libretro-webos-armv7a-make-default
    - .core-defs
