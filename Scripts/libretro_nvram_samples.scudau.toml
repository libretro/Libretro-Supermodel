# Scud Australia: native operator inventory and managed-field persistence.
# Use the reviewed Games.xml without the historical graphics-debug-menu patch.
[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "~/Library/Application Support/RetroArch/cores/supermodel_libretro.dylib"
rom_dir = "${SUPERMODEL_ROM_DIR}"
system_assets = "../Config"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"
[campaign]
game = "scudau"
standard_srm = "~/Documents/RetroArch/model3-nvram-analysis/scudau/game-base.srm"
output_dir = "~/Documents/RetroArch/model3-nvram-analysis/scudau/generated"
startup_wait = 6.0
button_hold = 0.06
button_hold_long = 0.12
default_wait = 0.4
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 45.0
window_width = 496
window_height = 384
[macros]
EnterServ = "TEST, WAIT(2)"
OpenGameAssignments = "SERVICE*8, TEST, WAIT(1)"
OpenNetAssignments = "@OpenGameAssignments"
SelectLinkType = "SERVICE"
SelectLinkId = "SERVICE*2"
ExitLinkType = "SERVICE*8, TEST, WAIT(0.5)"
ExitLinkId = "SERVICE*7, TEST, WAIT(0.5)"
ExitServfromNet = "SERVICE*4, TEST, WAIT(5)"
Close = "CLOSE"

[[samples]]
suffix = "link-00-master"
sequence = ["@EnterServ", "@OpenNetAssignments", "@SelectLinkType, TEST*0, WAIT(0.5)", "@ExitLinkType", "@ExitServfromNet", "@Close"]

[[samples]]
suffix = "link-01-slave"
sequence = ["@EnterServ", "@OpenNetAssignments", "@SelectLinkType, TEST*1, WAIT(0.5)", "@ExitLinkType", "@ExitServfromNet", "@Close"]

[[samples]]
suffix = "link-02-single"
sequence = ["@EnterServ", "@OpenNetAssignments", "@SelectLinkType, TEST*2, WAIT(0.5)", "@ExitLinkType", "@ExitServfromNet", "@Close"]

