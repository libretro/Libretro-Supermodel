# Supermodel NVRAM sample campaign. Paths support ~ and environment variables.

[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "~/Library/Application Support/RetroArch/cores/supermodel_libretro.dylib"
rom_dir = "${SUPERMODEL_ROM_DIR}"
system_assets = "../Config"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "bassdx"
standard_srm = "~/Documents/RetroArch/model3-nvram-analysis/bassdx/game-base.srm"
output_dir = "~/Documents/RetroArch/model3-nvram-analysis/bassdx/generated"

# Common timings, in real seconds.
# bassdx reaches its input-ready attract loop later than the other parents.
startup_wait = 12.0
button_hold = 0.06
button_hold_long = 0.12
default_wait = 0.18
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

# A macro may be a comma-separated string or an array of strings. Macros can
# reference other macros; *N repeats a button or macro. CLOSE performs the
# exact clean shutdown sequence Esc, wait, Esc on this RetroArch process only.
[macros]
EnterServ = "TEST, WAIT(0.7)"
OpenGameAssignments = "SERVICE*9, TEST, WAIT(0.5)"
SelectDifficultyType = "SERVICE*1"
ExitDifficultyType = "SERVICE*6, TEST, WAIT(0.5)"
# SelectCabinetType = "SERVICE*8"
# ExitCabinetType = "SERVICE*2, TEST, WAIT(0.5)"
# SelectLinkType = "SERVICE*9"
# ExitLinkType = "SERVICE, TEST, WAIT(0.5)"
ExitServfromGame = "SERVICE*5, TEST, WAIT(3.0)"
OpenCountryAssignments = "SERVICE*7,TEST*2, SERVICE*4, TEST, SERVICE*2, TEST, SERVICE*3, LONG(SERVICE)+TEST"
SelectCountryType = ""
ExitCountryType = "TEST, SERVICE*3, TEST, WAIT(0.5)"
ExitServfromCountry = "SERVICE*5, TEST, WAIT(3.0)"
Close = "CLOSE"

# Starting from the immutable DELUXE standard above, one press on Cabinet Type
# selects TWIN. The script copies the standard again before every other sample.
[[samples]]
suffix = "difficulty-00-normal"
sequence = [
  "@EnterServ",
  "@OpenGameAssignments",
  "@SelectDifficultyType, TEST*0, WAIT(0.5)",
  "@ExitDifficultyType",
  "@ExitServfromGame",
  "@Close",
]

