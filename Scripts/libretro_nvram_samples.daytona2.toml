# Supermodel NVRAM sample campaign. Paths support ~ and environment variables.

[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "~/Library/Application Support/RetroArch/cores/supermodel_libretro.dylib"
rom_dir = "${SUPERMODEL_ROM_DIR}"
system_assets = "../Config"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "daytona2"
standard_srm = "~/Documents/RetroArch/model3-nvram-analysis/daytona2/game-base.srm"
output_dir = "~/Documents/RetroArch/model3-nvram-analysis/daytona2/generated"

# Common timings, in real seconds.
startup_wait = 5.0
button_hold = 0.06
button_hold_long = 0.12
default_wait = 0.18
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

# A macro may be a comma-separated string or an array of strings. Macros can
# reference other macros; *N repeats a button or macro. CLOSE performs the
# exact clean shutdown sequence Esc, wait, Esc on this RetroArch process only.
[macros]
EnterServ = "TEST, WAIT(0.7)"
OpenGameAssignments = "SERVICE*8, TEST, WAIT(0.5)"
ExitServfromGame = "SERVICE*5, TEST, WAIT(3.0)"
SelectDifficultyType = "SERVICE*4"
ExitDifficultyType = "SERVICE*6, TEST, WAIT(0.5)"
SelectCabinetType = "SERVICE*3"
ExitCabinetType = "SERVICE*7, TEST, WAIT(0.5)"
SelectLinkType = "SERVICE*1"
ExitLinkType = "SERVICE*9, TEST, WAIT(0.5)"
ExitLinkType01 = "SERVICE*4, TEST, WAIT(0.5)"
ExitLinkType02 = "SERVICE*2, TEST, WAIT(0.5)"
ExitLinkType03 = "SERVICE*8, TEST, WAIT(0.5)"
ExitLinkId = "SERVICE*8, TEST, WAIT(0.5)"
OpenCountryAssignments = "HOLD(START), RIGHT, RIGHT, DOWN, LEFT, UP, LEFT, DOWN, RELEASE(START), WAIT(0.5)"
ExitServfromCountry = "TEST, WAIT(3.0)"
SelectCountryType = "SERVICE, WAIT(0.5)"
ExitCountryType = "SERVICE, TEST, WAIT(0.5)"
SelectVocalType = "SERVICE*6"
ExitVocalType = "SERVICE*4, TEST, WAIT(0.5)"
Close = "CLOSE"

# Starting from the immutable DELUXE standard above, one press on Cabinet Type
# selects TWIN. The script copies the standard again before every other sample.
[[samples]]
suffix = "difficulty-00-normal"
sequence = [
  "@EnterServ",
  "@OpenGameAssignments",
  "@SelectDifficultyType, TEST*0, WAIT(0.5)",
  "@ExitDifficultyType",
  "@ExitServfromGame",
  "@Close",
]

