# Supermodel NVRAM sample campaign. Paths support ~ and environment variables.

[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "~/Library/Application Support/RetroArch/cores/supermodel_libretro.dylib"
rom_dir = "${SUPERMODEL_ROM_DIR}"
system_assets = "../Config"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "lamachin"
standard_srm = "~/Documents/RetroArch/model3-nvram-analysis/lamachin/game-base.srm"
output_dir = "~/Documents/RetroArch/model3-nvram-analysis/lamachin/generated"

# Common timings, in real seconds.
startup_wait = 5.0
button_hold = 0.06
button_hold_long = 0.12
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

# A macro may be a comma-separated string or an array of strings. Macros can
# reference other macros; *N repeats a button or macro. CLOSE performs the
# exact clean shutdown sequence Esc, wait, Esc on this RetroArch process only.
[macros]
EnterServ = "TEST, WAIT(0.7)"
OpenGameAssignments = "SERVICE*6, TEST, WAIT(0.5)"
ExitServfromGame = "SERVICE*5, TEST, WAIT(4.0)"
SelectDifficultyType = "SERVICE*1"
ExitDifficultyType = "SERVICE*5, TEST, WAIT(0.5)"
SelectCabinetType = "SERVICE*5"
ExitCabinetType = "SERVICE*1, TEST, WAIT(0.5)"
ExitCabinetType01 = "SERVICE*2, TEST, WAIT(0.5)"
# SelectLinkComm = "SERVICE*1"
# ExitLinkComm = "SERVICE*1, TEST, WAIT(0.5)"
# ExitLinkComm01 = "SERVICE*3, TEST, WAIT(0.5)"
# SelectLinkType = "SERVICE*1, TEST*1, SERVICE*1"
# ExitLinkType = "SERVICE*2, TEST, WAIT(0.5)"
# SelectLinkId = "SERVICE*1, TEST*1, SERVICE*2"
# ExitLinkId = "SERVICE*1, TEST, WAIT(0.5)"
OpenCountryAssignments = "START*2, SERVICE, START*3, SERVICE, TEST, WAIT(0.5)"
ExitServfromCountry = "TEST, WAIT(4.0)"
SelectCountryType = ""
ExitCountryType = "TEST"
# OpenNetAssignments = "SERVICE*9, TEST, WAIT(0.5)"
# ExitServfromNet = "SERVICE*5, TEST, WAIT(4.0)"
Close = "CLOSE"

# Starting from the immutable DELUXE standard above, one press on Cabinet Type
# selects TWIN. The script copies the standard again before every other sample.
[[samples]]
suffix = "difficulty-00-level-05"
sequence = [
  "@EnterServ",
  "@OpenGameAssignments",
  "@SelectDifficultyType, TEST*0, WAIT(0.5)",
  "@ExitDifficultyType",
  "@ExitServfromGame",
  "@Close",
]

