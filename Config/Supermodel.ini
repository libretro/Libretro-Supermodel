;;
;; Supermodel Configuration File
;; Default settings for Version 0.3a.
;;
 

;
; Quick Overview
; --------------
;
; All settings are case sensitive.  Numbers must be integers.  Check your 
; spelling carefully because invalid settings are silently ignored.  To verify
; that your settings are being parsed correctly, check the contents of 
; error.log.
;
; Global options apply to all games.  To create configuration profiles for
; individual games, place settings under sections with the same name as the 
; corresponding MAME ROM set, like so:
;
;       ; Scud Race
;       [ scud ]
;
;       SoundVolume = 50
;       MusicVolume = 200
;       ; ... etc. ...
;
; Input mappings are an exceptional case: they are only allowed in the global
; section.  Per-game input mappings are not supported.
;
; For a list of all valid settings, please consult README.txt.  Only default
; inputs are assigned here.
;


[ Global ]  ; Input settings can only be read from the global section!

; Global Settings
GameXMLFile = Config/Games.xml
InitStateFile = 
PowerPCFrequency = 0
MultiThreaded = 1
GPUMultiThreaded = 1
MultiTexture = 0
VertexShader = 
FragmentShader = 
EmulateSound = 1
EmulateDSB = 1
SoundVolume = 100
MusicVolume = 100
SoundFreq = 57.5242
LegacySoundDSP = 0
Balance = 0
BalanceLeftRight = 0
BalanceFrontRear = 0
NbSoundChannels = 4

; Video/Display Settings
New3DEngine = 1
QuadRendering = 0
XResolution = 1924
YResolution = 768
FullScreen = 0
BorderlessWindow = 0
Supersampling = 1
CRTcolors = 0
UpscaleMode = 2
WideScreen = 0
Stretch = 0
WideBackground = 0
VSync = 1
Throttle = 1
RefreshRate = 60
ShowFrameRate = 0
Crosshairs = 0
CrosshairStyle = vector
NoWhiteFlash = 0
FlipStereo = 0

; Input Settings
InputSystem = libretro
InputDigitalSensitivity = 25
InputDigitalDecaySpeed = 50
InputMouseXDeadZone = 0
InputMouseYDeadZone = 0
InputMouseZDeadZone = 0


; The Libretro core applies its controller layouts (and the driving, gun and
; Star Wars input options) after reading this file. For the controls those
; layouts set, the lines below show the core's defaults; editing them has no
; effect. Remap gamepad buttons in RetroArch instead.
; Common 
InputStart1 = "KEY_1,JOY1_BUTTON9"
InputStart2 = "KEY_2,JOY2_BUTTON9"
InputCoin1 = "KEY_3,JOY1_BUTTON10"
InputCoin2 = "KEY_4,JOY2_BUTTON10"
InputServiceA = "KEY_5,JOY1_BUTTON22"    ; R3 (R with the shoulder option)
InputServiceB = "KEY_7,JOY1_BUTTON24,JOY2_BUTTON22" ; R2 with the shoulder option, P2 R3
InputTestA = "KEY_6,JOY1_BUTTON21"       ; L3 (L with the shoulder option)
InputTestB = "KEY_8,JOY1_BUTTON23,JOY2_BUTTON21" ; L2 with the shoulder option, P2 L3

; 4-way digital joysticks
; We map D-Pad to BUTTON11-14 instead of POV UP/DOWN
InputJoyUp    = "KEY_UP,JOY1_BUTTON11"
InputJoyDown  = "KEY_DOWN,JOY1_BUTTON12"
InputJoyLeft  = "KEY_LEFT,JOY1_BUTTON13"
InputJoyRight = "KEY_RIGHT,JOY1_BUTTON14"

; Player 2 (if needed)
InputJoyUp2    = "JOY2_BUTTON11"
InputJoyDown2  = "JOY2_BUTTON12"
InputJoyLeft2  = "JOY2_BUTTON13"
InputJoyRight2 = "JOY2_BUTTON14"

; Fighting game buttons
InputPunch = "JOY1_BUTTON1"
InputKick = "JOY1_BUTTON2"
InputGuard = "JOY1_BUTTON3"
InputEscape = "JOY1_BUTTON4"
InputPunch2 = "JOY2_BUTTON1"
InputKick2 = "JOY2_BUTTON2"
InputGuard2 = "JOY2_BUTTON3"
InputEscape2 = "JOY2_BUTTON4"

; Spikeout buttons
InputShift = "JOY1_BUTTON1"
InputBeat = "JOY1_BUTTON2"
InputCharge = "JOY1_BUTTON3"
InputJump = "JOY1_BUTTON4"

; Virtua Striker buttons
InputShortPass = "JOY1_BUTTON1"
InputLongPass = "JOY1_BUTTON2"
InputShoot = "JOY1_BUTTON3"
InputShortPass2 = "JOY2_BUTTON1"
InputLongPass2 = "JOY2_BUTTON2"
InputShoot2 = "JOY2_BUTTON3"

; Steering wheel
InputSteeringLeft = "KEY_LEFT"      ; digital, turn wheel left
InputSteeringRight = "KEY_RIGHT"    ; digital, turn wheel right
InputSteering = "JOY1_XAXIS"        ; analog, full steering range

; Pedals
InputAccelerator = "KEY_UP,JOY1_RZAXIS_POS"   ; R2
InputBrake = "KEY_DOWN,JOY1_ZAXIS_POS"        ; L2

; Up/down shifter manual transmission (all racers)
InputGearShiftUp = "JOY1_BUTTON6"      ; R: sequential shift up
InputGearShiftDown = "JOY1_BUTTON5"    ; L: sequential shift down

; 4-Speed manual transmission (Daytona 2, Sega Rally 2, Scud Race)
InputGearShift1 = "JOY1_BUTTON17"     ; H-pattern: right stick up-left
InputGearShift2 = "JOY1_BUTTON18"     ; down-left
InputGearShift3 = "JOY1_BUTTON19"     ; up-right
InputGearShift4 = "JOY1_BUTTON20"     ; down-right
InputGearShiftN = "JOY1_BUTTON3"       ; Y

; VR4 view change buttons (Daytona 2, Le Mans 24, Scud Race)
InputVR1 = "JOY1_BUTTON25"   ; D-Pad Up
InputVR2 = "JOY1_BUTTON26"   ; D-Pad Down
InputVR3 = "JOY1_BUTTON27"   ; D-Pad Left
InputVR4 = "JOY1_BUTTON28"   ; D-Pad Right

; Single view change button (Dirt Devils, ECA, Harley-Davidson, Sega Rally 2)
InputViewChange = "JOY1_BUTTON25"   ; D-Pad Up

; Handbrake (Dirt Devils, Sega Rally 2)
InputHandBrake = "JOY1_BUTTON1"     ; B

; Harley-Davidson controls
InputRearBrake = "JOY1_BUTTON1"     ; B
InputMusicSelect = "JOY1_BUTTON2"   ; A

; Virtual On macros
InputTwinJoyTurnLeft = "NONE"
InputTwinJoyTurnRight = "NONE"
InputTwinJoyForward = "KEY_UP"
InputTwinJoyReverse = "KEY_DOWN"
InputTwinJoyStrafeLeft = "KEY_LEFT"
InputTwinJoyStrafeRight = "KEY_RIGHT"
InputTwinJoyJump = "NONE"
InputTwinJoyCrouch = "NONE"

; Virtual On individual joystick mapping: left stick = left lever, right stick = right lever
InputTwinJoyLeft1 = "JOY1_XAXIS_NEG"
InputTwinJoyLeft2 = "JOY1_RXAXIS_NEG"
InputTwinJoyRight1 = "JOY1_XAXIS_POS"
InputTwinJoyRight2 = "JOY1_RXAXIS_POS"
InputTwinJoyUp1 = "JOY1_YAXIS_NEG"
InputTwinJoyUp2 = "JOY1_RYAXIS_NEG"
InputTwinJoyDown1 = "JOY1_YAXIS_POS"
InputTwinJoyDown2 = "JOY1_RYAXIS_POS"

; Virtual On buttons
InputTwinJoyShot1 = "JOY1_BUTTON7"    ; L2
InputTwinJoyShot2 = "JOY1_BUTTON8"    ; R2
InputTwinJoyTurbo1 = "JOY1_BUTTON5"   ; L
InputTwinJoyTurbo2 = "JOY1_BUTTON6"   ; R

; Analog joystick (Star Wars Trilogy)
InputAnalogJoyUp = "KEY_UP"
InputAnalogJoyDown = "KEY_DOWN,JOY1_BUTTON12"
InputAnalogJoyLeft = "KEY_LEFT,JOY1_BUTTON13"
InputAnalogJoyRight = "KEY_RIGHT,JOY1_BUTTON14"
InputAnalogJoyX = "MOUSE7_XAXIS"            ; analog, full X axis (yoke: mouse or stick)
InputAnalogJoyY = "MOUSE7_YAXIS"            ; analog, full Y axis (yoke: mouse or stick)
InputAnalogJoyTrigger = "MOUSE7_LEFT_BUTTON"
InputAnalogJoyEvent = "MOUSE7_RIGHT_BUTTON"
InputAnalogJoyTrigger2 = "MOUSE7_BUTTON4"
InputAnalogJoyEvent2 = "MOUSE7_BUTTON5"

; Light guns (Lost World)
InputGunLeft = "KEY_LEFT"               ; digital, move gun left
InputGunRight = "KEY_RIGHT"             ; digital, move gun right
InputGunUp = "KEY_UP"                   ; digital, move gun up
InputGunDown = "KEY_DOWN"               ; digital, move gun down
InputGunX = "MOUSE_XAXIS,JOY1_XAXIS"    ; analog, full X axis
InputGunY = "MOUSE_YAXIS,JOY1_YAXIS"    ; analog, full Y axis
InputTrigger = "JOY1_BUTTON1,MOUSE_LEFT_BUTTON"
InputOffscreen = "JOY1_BUTTON2,MOUSE_RIGHT_BUTTON"    ; point off-screen
InputAutoTrigger = 0                    ; automatic reload when off-screen
InputGunLeft2 = "NONE"
InputGunRight2 = "NONE"
InputGunUp2 = "NONE"
InputGunDown2 = "NONE"
InputGunX2 = "JOY2_XAXIS"
InputGunY2 = "JOY2_YAXIS"
InputTrigger2 = "JOY2_BUTTON1"
InputOffscreen2 = "JOY2_BUTTON2"
InputAutoTrigger2 = 0

; Analog guns (Ocean Hunter, LA Machineguns)
InputAnalogGunLeft = "KEY_LEFT"               ; digital, move gun left
InputAnalogGunRight = "KEY_RIGHT"             ; digital, move gun right
InputAnalogGunUp = "KEY_UP"                   ; digital, move gun up
InputAnalogGunDown = "KEY_DOWN"               ; digital, move gun down
InputAnalogGunX = "MOUSE5_XAXIS"              ; analog, full X axis (P1 gun cursor)
InputAnalogGunY = "MOUSE5_YAXIS"              ; analog, full Y axis (P1 gun cursor)
InputAnalogTriggerLeft = "MOUSE5_LEFT_BUTTON"
