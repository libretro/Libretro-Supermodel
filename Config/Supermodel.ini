InputSkiPollRight = "JOY1_BUTTON6"   ; R
InputSkiSelect1 = "JOY1_BUTTON3"
InputSkiSelect2 = "JOY1_BUTTON1,JOY1_BUTTON9"   ; B or Start
InputSkiSelect3 = "JOY1_BUTTON2"     ; A

; Magical Truck Adventure controls
InputMagicalLeverUp1 = "KEY_UP"
InputMagicalLeverDown1 = "KEY_DOWN"
